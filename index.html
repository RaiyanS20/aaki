<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a1f3d">
  <title>Birthday Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <span id="count">📜 0/3</span>
    <span id="objective"></span>
    <button id="mute" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="area"></div>

  <div id="touch"><div id="stick"><div id="knob"></div></div><button id="btnA" aria-label="Interact">A</button></div>

  <div id="dialog" class="hidden">
    <div id="portrait"></div>
    <div id="dbody">
      <div id="speaker"></div>
      <div id="dtext"></div>
      <div id="dnext">▼</div>
    </div>
  </div>

  <div id="scroll" class="hidden">
    <div class="scroll-wrap">
      <div class="rod"></div>
      <div class="paper">
        <h2 id="stitle"></h2>
        <div id="sbody"></div>
        <div class="seal">♥</div>
      </div>
      <div class="rod"></div>
      <button id="sclose">Roll it up ✨</button>
    </div>
  </div>

  <div id="title" class="screen">
    <div class="stars"></div>
    <p class="kicker">✦ a tiny pixel adventure ✦</p>
    <h1><span id="title-name">Aaki</span>'s<br>Birthday Quest</h1>
    <canvas id="title-sprites" width="48" height="24"></canvas>
    <button id="startBtn" class="big">▶ Start</button>
    <p class="hint">best with sound on 🔊</p>
  </div>

  <div id="custom" class="screen hidden">
    <h2>Create your character</h2>
    <div class="cc">
      <div class="cc-look">
        <img id="cc-portrait" src="assets/aaki-portrait.png" alt="">
        <canvas id="preview" width="32" height="20"></canvas>
      </div>
      <div class="cc-opts">
        <label>Name <input id="nameIn" maxlength="16" autocomplete="off"></label>
        <div class="row"><span>Hijab</span><div id="sw-hijab" class="sws"></div></div>
        <div class="row"><span>Outfit</span><div id="sw-dress" class="sws"></div></div>
        <div class="row"><span>Skin</span><div id="sw-skin" class="sws"></div></div>
      </div>
    </div>
    <button id="goBtn" class="big">Begin adventure ✨</button>
  </div>

  <div id="ending" class="hidden">
    <div class="ecard">
      <div class="rose-wrap"><img id="erose" alt="Gem Rose"></div>
      <h1 id="etitle"></h1>
      <h3 id="enote-title"></h3>
      <div id="enote"></div>
      <p id="efrom"></p>
      <div class="ebtns"><button id="ekeep">Keep exploring 🐾</button><button id="eagain">Play again</button></div>
    </div>
  </div>

  <div id="fade"></div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/game.js"></script>
  <script>document.getElementById('erose').src = Art.rose.toDataURL();</script>
</body>
</html>
